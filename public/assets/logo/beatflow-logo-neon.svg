<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Multi-stage neon outer glow for ring -->
    <filter id="neonRingGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- White text glow filter matching the reference image -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3D Torus Neon Gradient for the O (Blue bottom -> Violet mid -> Magenta/Hot Pink top) -->
    <linearGradient id="neonGradientO" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="55%" stop-color="#8A3FFC" />
      <stop offset="85%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FF4DDB" />
    </linearGradient>

    <!-- Radial flare on the top right of the ring -->
    <radialGradient id="ringHighlight" cx="75%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FF4DDB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8A3FFC" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g id="beatflow-logo">
    <!-- Ambient back light -->
    <circle cx="352" cy="68" r="38" fill="#8A3FFC" opacity="0.3" filter="url(#neonRingGlow)" />
    <circle cx="352" cy="68" r="48" fill="#00D1FF" opacity="0.18" filter="url(#neonRingGlow)" />

    <!-- "BEAT FL" Letters -->
    <text x="12" y="92" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="76" letter-spacing="-0.04em" filter="url(#whiteGlow)">
      BEAT FL
    </text>

    <!-- The 3D Luminous Neon Ring 'O' -->
    <g transform="translate(352, 68)">
      <!-- Deep Blue-Violet Ambient Aura -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#3B82F6" stroke-width="12" opacity="0.45" filter="url(#neonRingGlow)" />
      
      <!-- Primary Vibrant Torus Ring Body -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#neonGradientO)" stroke-width="8.5" filter="url(#neonRingGlow)" />
      
      <!-- Dark Inner Hole Core (Ensures deep contrast) -->
      <circle cx="0" cy="0" r="23" fill="#08080F" />

      <!-- Inner rim reflection -->
      <circle cx="0" cy="0" r="23" fill="none" stroke="url(#neonGradientO)" stroke-width="2" opacity="0.8" />

      <!-- Top-right hot specular flare -->
      <path d="M 12 -25 A 28 28 0 0 1 27 -6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95" />
      
      <!-- Bottom-left cyan subtle rim -->
      <path d="M -26 10 A 28 28 0 0 0 -8 26" fill="none" stroke="#00D1FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- "W" Letter -->
    <text x="396" y="92" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="76" letter-spacing="-0.04em" filter="url(#whiteGlow)">
      W
    </text>

    <!-- "by NEXORA" Sub-label -->
    <text x="472" y="124" fill="rgba(255,255,255,0.72)" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="14" letter-spacing="0.24em" text-anchor="end">
      by NEXORA
    </text>
  </g>
</svg>
